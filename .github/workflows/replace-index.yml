name: Replace index
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  replace-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace index.html
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm index.html
          git mv wedding-reels-india-website.html index.html
          git status --short
          git commit -m "Replace index.html with updated website"
          git push
