name: Replace index.html (temporary)
on:
  workflow_dispatch:
jobs:
  replace:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Replace index.html
        run: |
          set -e
          test -f wedding-reels-india-website.html
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git rm index.html
          git mv wedding-reels-india-website.html index.html
          git commit -m "Replace index.html with updated website"
          git push
