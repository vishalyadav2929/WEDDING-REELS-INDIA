name: Replace index.html
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  replace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace index.html with updated website
        run: |
          if [ ! -f wedding-reels-india-website.html ]; then echo "No replacement file found"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git rm index.html
          git mv wedding-reels-india-website.html index.html
          git commit -m "Replace index.html with updated website"
          git push
